name: Construir munique/openmu 0.9.10-fix2

# Construye la imagen del servidor OpenMU con los DOS parches del guardado:
#   1. openmu-0.9.10-fix-guardado.patch      (el ya instalado: PR 854, serializa el guardado periodico)
#   2. openmu-0.9.10-fix2-guardado-huerfano.patch (nuevo: choque al desconectarse + filas huerfanas)
# Igual que la receta anterior, pero con el segundo parche encima.
# Resultado: un Release con openmu-0.9.10-fix2.tar.gz (docker save) y su sha256.
# En el servidor se carga con docker load y se apunta el compose a munique/openmu:0.9.10-fix2.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: OpenMU commit d4ca915c + parche 1 + parche 2
    runs-on: ubuntu-latest
    steps:
      - name: Receta y parches (este repositorio)
        uses: actions/checkout@v4
        with:
          path: receta

      - name: Codigo de OpenMU en el commit exacto de la imagen 0.9.10 del 26-07-2026
        uses: actions/checkout@v4
        with:
          repository: MUnique/OpenMU
          ref: d4ca915c442a56e267e3f01638822f367fa81082
          path: OpenMU

      - name: Comprobar version y aplicar los dos parches
        working-directory: OpenMU
        run: |
          echo "commit base: $(git rev-parse HEAD)"
          grep -q 'AssemblyVersion("0.9.10.0")' src/SharedAssemblyInfo.cs || { echo "el commit base no dice version 0.9.10" >&2; exit 1; }
          git apply --check ../receta/openmu-0.9.10-fix-guardado.patch
          git apply ../receta/openmu-0.9.10-fix-guardado.patch
          git apply --check ../receta/openmu-0.9.10-fix2-guardado-huerfano.patch
          git apply ../receta/openmu-0.9.10-fix2-guardado-huerfano.patch
          git status --short
          m=$(git status --short | grep -c '^ M ' || true); n=$(git status --short | grep -c '^?? ' || true)
          [ "$m" = "5" ] && [ "$n" = "1" ] || { echo "esperaba 5 archivos modificados y 1 nuevo, hay $m y $n" >&2; exit 1; }
          grep -q RunPersistenceExclusiveAsync src/GameLogic/Player.cs || { echo "el parche 1 no quedo en Player.cs" >&2; exit 1; }
          grep -q TryReconcileStaleEntriesAsync src/Persistence/EntityFramework/EntityFrameworkContextBase.cs || { echo "el parche 2 no quedo en EntityFrameworkContextBase.cs" >&2; exit 1; }
          grep -q "the OpenMU issue 865" src/GameLogic/Player.cs || { echo "el parche 2 no quedo en RemoveFromGameAsync" >&2; exit 1; }

      - name: Construir la imagen (mismo comando que el paquete)
        working-directory: OpenMU/src
        run: docker build -f Startup/Dockerfile -t munique/openmu:0.9.10-fix2 .

      - name: Verificar la imagen
        run: |
          docker image inspect munique/openmu:0.9.10-fix2 --format 'id {{.Id}} creada {{.Created}} tamano {{.Size}} bytes arquitectura {{.Architecture}}'
          [ "$(docker image inspect munique/openmu:0.9.10-fix2 --format '{{.Architecture}}')" = "amd64" ] || { echo "arquitectura inesperada" >&2; exit 1; }

      - name: Empaquetar (docker save)
        run: |
          docker save munique/openmu:0.9.10-fix2 | gzip -6 > openmu-0.9.10-fix2.tar.gz
          sha256sum openmu-0.9.10-fix2.tar.gz | tee sha256.txt
          ls -l openmu-0.9.10-fix2.tar.gz

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="openmu-0.9.10-fix2-r${{ github.run_number }}"
          {
            echo "Imagen docker munique/openmu:0.9.10-fix2 = OpenMU en el commit d4ca915c442a56e267e3f01638822f367fa81082"
            echo "(la misma base que la imagen oficial 0.9.10 del 26-07-2026) mas los dos parches del guardado:"
            echo "PR 854 (guardado periodico) y el arreglo del choque al desconectarse mas las filas huerfanas."
            echo
            echo "Cargar en el servidor: docker load -i openmu-0.9.10-fix2.tar.gz (queda con el nombre munique/openmu:0.9.10-fix2)."
            echo
            echo "sha256:"
            echo '```'
            cat sha256.txt
            echo '```'
          } > notas.md
          gh release create "$TAG" --repo "${{ github.repository }}" --title "munique/openmu:0.9.10-fix2 ($TAG)" --notes-file notas.md openmu-0.9.10-fix2.tar.gz sha256.txt
